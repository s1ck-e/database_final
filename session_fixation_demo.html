<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Fixation Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { margin-bottom: 30px; color: #333; }
        .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .demo-section { padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .vulnerable { border-top: 4px solid #f44336; }
        .secure { border-top: 4px solid #4caf50; }
        h2 { font-size: 18px; margin-bottom: 15px; }
        .steps { display: flex; flex-direction: column; gap: 10px; }
        button { 
            padding: 10px 15px; 
            background: #2196F3; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover { background: #1976D2; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result-box { 
            margin-top: 15px; 
            padding: 12px; 
            background: #f0f0f0; 
            border-left: 4px solid #2196F3;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
        }
        .result-label { font-weight: bold; color: #333; margin-bottom: 5px; }
        .session-id { color: #f44336; font-size: 14px; }
        .status { padding: 10px; border-radius: 4px; margin-top: 10px; }
        .status.same { background: #ffebee; color: #c62828; }
        .status.changed { background: #e8f5e9; color: #2e7d32; }
        .clear-btn { background: #757575; margin-top: 10px; }
        .clear-btn:hover { background: #616161; }
        @media(max-width: 768px) {
            .demo-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Session Fixation Vulnerability Demo</h1>
        
        <div class="demo-grid">
            <!-- Vulnerable Version -->
            <div class="demo-section vulnerable">
                <h2>🚨 ЭМЗЭГ ХУВИЛБАР</h2>
                <p style="color: #666; margin-bottom: 15px;">Session ID өөрчлөгдөхгүй</p>
                
                <div class="steps">
                    <button onclick="step1Vuln()">1️⃣ Анхны Session ID шалгах</button>
                    <button onclick="step2Vuln()">2️⃣ Нэвтрэх</button>
                    <button onclick="step3Vuln()">3️⃣ Session ID дахин шалгах</button>
                    <button class="clear-btn" onclick="clearVuln()">🔄 Дахин эхлүүлэх</button>
                </div>

                <div id="vuln-result1" class="result-box" style="display:none;">
                    <div class="result-label">Нэвтэрэхийн ӨМН:</div>
                    <div class="session-id" id="vuln-before">-</div>
                </div>

                <div id="vuln-result2" class="result-box" style="display:none;">
                    <div class="result-label">Нэвтэрсний ХОЙНО:</div>
                    <div class="session-id" id="vuln-after">-</div>
                </div>

                <div id="vuln-status" class="result-box" style="display:none;">
                    <div class="result-label">Үр дүн:</div>
                    <div id="vuln-comparison"></div>
                </div>
            </div>

            <!-- Secure Version -->
            <div class="demo-section secure">
                <h2>✅ ХАМГААЛАЛТТАЙ ХУВИЛБАР</h2>
                <p style="color: #666; margin-bottom: 15px;">Session ID шинэчлэгдэнэ</p>
                
                <div class="steps">
                    <button onclick="step1Secure()">1️⃣ Анхны Session ID шалгах</button>
                    <button onclick="step2Secure()">2️⃣ Нэвтрэх</button>
                    <button onclick="step3Secure()">3️⃣ Session ID дахин шалгах</button>
                    <button class="clear-btn" onclick="clearSecure()">🔄 Дахин эхлүүлэх</button>
                </div>

                <div id="sec-result1" class="result-box" style="display:none;">
                    <div class="result-label">Нэвтэрэхийн ӨМН:</div>
                    <div class="session-id" id="sec-before">-</div>
                </div>

                <div id="sec-result2" class="result-box" style="display:none;">
                    <div class="result-label">Нэвтэрсний ХОЙНО:</div>
                    <div class="session-id" id="sec-after">-</div>
                </div>

                <div id="sec-status" class="result-box" style="display:none;">
                    <div class="result-label">Үр дүн:</div>
                    <div id="sec-comparison"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = {
            session: 'session_test.php',
            login_vuln: 'login.php',
            login_sec: 'unsecure/login.php'
        };

        async function api(url) {
            try {
                const response = await fetch(url, { credentials: 'include' });
                return response.json();
            } catch(e) {
                console.error('Error:', e);
                return { error: e.message };
            }
        }

        // VULNERABLE
        async function step1Vuln() {
            const data = await api(API.session);
            const id = data.session_id;
            document.getElementById('vuln-before').textContent = id;
            document.getElementById('vuln-result1').style.display = 'block';
            document.getElementById('vuln-status').style.display = 'none';
            window.vuln_before = id;
        }

        async function step2Vuln() {
            const response = await fetch(API.login_vuln, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'test@example.com', password: 'testpass123' })
            });
            const data = await response.json();
            if (!data.success) {
                alert('Login failed: ' + data.message);
                return;
            }
            alert('✅ ' + data.message);
        }

        async function step3Vuln() {
            const data = await api(API.session);
            const id = data.session_id;
            document.getElementById('vuln-after').textContent = id;
            document.getElementById('vuln-result2').style.display = 'block';
            
            const same = window.vuln_before === id;
            const statusEl = document.getElementById('vuln-comparison');
            const statusBox = document.getElementById('vuln-status');
            
            if (same) {
                statusEl.innerHTML = `<div class="status same">❌ Session ID ижилхэн! (${id})<br>Session fixation халдлага боломжтой!</div>`;
            } else {
                statusEl.innerHTML = `<div class="status changed">✅ Session ID шинэчлэгдсэн<br>Өмнө: ${window.vuln_before}<br>Хойно: ${id}</div>`;
            }
            statusBox.style.display = 'block';
        }

        function clearVuln() {
            document.getElementById('vuln-result1').style.display = 'none';
            document.getElementById('vuln-result2').style.display = 'none';
            document.getElementById('vuln-status').style.display = 'none';
            window.vuln_before = null;
        }

        // SECURE
        async function step1Secure() {
            const data = await api(API.session);
            const id = data.session_id;
            document.getElementById('sec-before').textContent = id;
            document.getElementById('sec-result1').style.display = 'block';
            document.getElementById('sec-status').style.display = 'none';
            window.sec_before = id;
        }

        async function step2Secure() {
            const response = await fetch(API.login_sec, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'test@example.com', password: 'testpass123' })
            });
            const data = await response.json();
            if (!data.success) {
                alert('Login failed: ' + data.message);
                return;
            }
            alert('✅ ' + data.message);
        }

        async function step3Secure() {
            const data = await api(API.session);
            const id = data.session_id;
            document.getElementById('sec-after').textContent = id;
            document.getElementById('sec-result2').style.display = 'block';
            
            const same = window.sec_before === id;
            const statusEl = document.getElementById('sec-comparison');
            const statusBox = document.getElementById('sec-status');
            
            if (same) {
                statusEl.innerHTML = `<div class="status same">❌ Session ID ижилхэн! (${id})<br>Алдаа: session_regenerate_id() ажилалгүй</div>`;
            } else {
                statusEl.innerHTML = `<div class="status changed">✅ Session ID шинэчлэгдсэн!<br>Өмнө: ${window.sec_before}<br>Хойно: ${id}<br>Session fixation халдлагаас хамгаалагдсан</div>`;
            }
            statusBox.style.display = 'block';
        }

        function clearSecure() {
            document.getElementById('sec-result1').style.display = 'none';
            document.getElementById('sec-result2').style.display = 'none';
            document.getElementById('sec-status').style.display = 'none';
            window.sec_before = null;
        }
    </script>
</body>
</html>
